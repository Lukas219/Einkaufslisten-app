<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meine Einkaufslisten</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="theme-color" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Einkauf">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f2f7ff;
    color: #111;
}

header {
    background: #007aff;
    color: white;
    padding: 20px;
    text-align: center;
}

.header-logo {
    width: 70px;
    height: 70px;
    border-radius: 16px;
    display: block;
    margin: 0 auto 10px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

input, select, button {
    font: inherit;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 12px;
    margin-bottom: 10px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 11px 15px;
    cursor: pointer;
}

.primary {
    background: #007aff;
    color: white;
    width: 100%;
}

.danger {
    background: #ff3b30;
    color: white;
}

.secondary {
    background: #e9eef5;
}

.item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 5px;
    border-bottom: 1px solid #eee;
}

.item:last-child {
    border-bottom: none;
}

.item-info {
    flex: 1;
    cursor: pointer;
}

.item-name {
    font-weight: 600;
}

.item-details {
    font-size: 13px;
    color: #777;
    margin-top: 3px;
}

.purchased .item-name {
    text-decoration: line-through;
    opacity: .5;
}

.actions {
    display: flex;
    gap: 5px;
}

.actions button {
    padding: 7px 10px;
}

.progress {
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 8px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #34c759;
    transition: width .3s;
}

.stats {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
}

.list-buttons {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.list-button {
    white-space: nowrap;
    background: #e9eef5;
}

.list-button.active {
    background: #007aff;
    color: white;
}

.search {
    margin-top: 10px;
}

.hidden {
    display: none;
}

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 999;
}

.toast.show {
    opacity: 1;
}

.dark {
    background: #121212;
    color: white;
}

.dark .card {
    background: #1e1e1e;
}

.dark input,
.dark select {
    background: #292929;
    color: white;
    border-color: #444;
}

.dark .secondary,
.dark .list-button {
    background: #333;
    color: white;
}

.dark .item {
    border-color: #444;
}

.dark .item-details {
    color: #aaa;
}

h2 {
    margin-top: 0;
}
</style>
</head>

<body>

<header>
    <img src="icons/icon-192.png" class="header-logo" alt="Einkaufslisten Logo">
    <h1>Meine Einkaufslisten</h1>
</header>

<div class="container">

    <div class="card">
        <h2>Meine Listen</h2>

        <div id="listButtons" class="list-buttons"></div>

        <button class="primary" onclick="neueListe()">
            + Neue Liste
        </button>
    </div>

    <div class="card">
        <h2 id="listenTitel">Einkaufsliste</h2>

        <input
            id="artikel"
            type="text"
            placeholder="Was möchtest du kaufen?"
            onkeydown="enterHinzufuegen(event)"
        >

        <input
            id="menge"
            type="number"
            min="1"
            value="1"
            placeholder="Menge"
        >

        <select id="kategorie">
            <option value="Sonstiges">Sonstiges</option>
            <option value="Obst & Gemüse">Obst & Gemüse</option>
            <option value="Milchprodukte">Milchprodukte</option>
            <option value="Fleisch">Fleisch</option>
            <option value="Getränke">Getränke</option>
            <option value="Süßigkeiten">Süßigkeiten</option>
            <option value="Tiefkühl">Tiefkühl</option>
            <option value="Haushalt">Haushalt</option>
        </select>

        <button class="primary" onclick="artikelHinzufuegen()">
            + Artikel hinzufügen
        </button>

        <input
            id="suche"
            class="search"
            type="text"
            placeholder="🔎 Artikel suchen..."
            oninput="anzeigen()"
        >
    </div>

    <div class="card">
        <div class="stats">
            <span>Artikel: <b id="anzahl">0</b></span>
            <span>Gekauft: <b id="gekauft">0</b></span>
        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>

    <div class="card">
        <div id="liste"></div>

        <button class="secondary" onclick="gekaufteLoeschen()">
            Gekaufte löschen
        </button>

        <button class="secondary" onclick="rueckgaengig()">
            ↩ Rückgängig
        </button>
    </div>

    <div class="card">
        <h2>⚙️ Einstellungen</h2>

        <button class="secondary" onclick="darkMode()">
            🌙 Dark Mode
        </button>

        <br><br>

        <button class="secondary" onclick="backupExportieren()">
            💾 Backup speichern
        </button>

        <br><br>

        <button class="secondary" onclick="backupImportieren()">
            📂 Backup laden
        </button>

        <br><br>

        <button class="danger" onclick="allesZuruecksetzen()">
            🗑️ Alle Daten löschen
        </button>
    </div>

</div>

<div id="toast" class="toast"></div>

<input
    id="backupDatei"
    type="file"
    accept=".json"
    style="display:none"
    onchange="backupDateiLaden(event)"
>

<script>

let listen = JSON.parse(localStorage.getItem("listen")) || {
    "Meine Einkaufsliste": []
};

let aktuelleListe =
    localStorage.getItem("aktuelleListe") || "Meine Einkaufsliste";

let letzterStand = null;

function speichern() {
    localStorage.setItem("listen", JSON.stringify(listen));
    localStorage.setItem("aktuelleListe", aktuelleListe);
}

function toast(text) {
    const element = document.getElementById("toast");

    element.textContent = text;
    element.classList.add("show");

    setTimeout(() => {
        element.classList.remove("show");
    }, 2000);
}

function artikelHinzufuegen() {

    const artikelInput = document.getElementById("artikel");
    const mengeInput = document.getElementById("menge");
    const kategorieInput = document.getElementById("kategorie");

    const artikel = artikelInput.value.trim();
    const menge = parseInt(mengeInput.value) || 1;
    const kategorie = kategorieInput.value;

    if (!artikel) {
        toast("Bitte einen Artikel eingeben.");
        return;
    }

    letzterStand = JSON.stringify(listen);

    listen[aktuelleListe].push({
        artikel: artikel,
        menge: menge,
        kategorie: kategorie,
        gekauft: false
    });

    artikelInput.value = "";
    mengeInput.value = "1";

    speichern();
    anzeigen();

    toast("Artikel hinzugefügt ✓");
}

function enterHinzufuegen(event) {
    if (event.key === "Enter") {
        artikelHinzufuegen();
    }
}

function anzeigen() {

    const container = document.getElementById("liste");
    const suche =
        document.getElementById("suche").value.toLowerCase();

    const aktuelleArtikel = listen[aktuelleListe];

    container.innerHTML = "";

    aktuelleArtikel
        .map((artikel, index) => ({ artikel, index }))
        .filter(obj =>
            obj.artikel.artikel.toLowerCase().includes(suche)
        )
        .forEach(obj => {

            const artikel = obj.artikel;
            const index = obj.index;

            const div = document.createElement("div");

            div.className =
                "item " + (artikel.gekauft ? "purchased" : "");

            div.innerHTML = `
                <input
                    type="checkbox"
                    ${artikel.gekauft ? "checked" : ""}
                    onchange="gekauftAendern(${index})"
                >

                <div class="item-info"
                     onclick="gekauftAendern(${index})">

                    <div class="item-name">
                        ${escapeHTML(artikel.artikel)}
                    </div>

                    <div class="item-details">
                        Menge: ${artikel.menge}
                        · ${escapeHTML(artikel.kategorie)}
                    </div>

                </div>

                <div class="actions">

                    <button
                        class="secondary"
                        onclick="event.stopPropagation(); artikelBearbeiten(${index})">
                        ✏️
                    </button>

                    <button
                        class="danger"
                        onclick="event.stopPropagation(); artikelLoeschen(${index})">
                        🗑️
                    </button>

                </div>
            `;

            container.appendChild(div);
        });

    statistikAnzeigen();
    listenAnzeigen();
}

function escapeHTML(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function gekauftAendern(index) {

    letzterStand = JSON.stringify(listen);

    listen[aktuelleListe][index].gekauft =
        !listen[aktuelleListe][index].gekauft;

    speichern();
    anzeigen();
}

function artikelLoeschen(index) {

    letzterStand = JSON.stringify(listen);

    listen[aktuelleListe].splice(index, 1);

    speichern();
    anzeigen();

    toast("Artikel gelöscht");
}

function artikelBearbeiten(index) {

    const artikel = listen[aktuelleListe][index];

    const neuerName =
        prompt("Artikel bearbeiten:", artikel.artikel);

    if (neuerName === null) return;

    if (!neuerName.trim()) return;

    const neueMenge =
        prompt("Menge:", artikel.menge);

    letzterStand = JSON.stringify(listen);

    artikel.artikel = neuerName.trim();

    if (neueMenge !== null && neueMenge !== "") {
        artikel.menge = parseInt(neueMenge) || artikel.menge;
    }

    speichern();
    anzeigen();

    toast("Artikel geändert ✓");
}

function gekauftLoeschen() {

    letzterStand = JSON.stringify(listen);

    listen[aktuelleListe] =
        listen[aktuelleListe].filter(
            artikel => !artikel.gekauft
        );

    speichern();
    anzeigen();

    toast("Gekaufte Artikel gelöscht");
}

function rueckgaengig() {

    if (!letzterStand) {
        toast("Nichts rückgängig zu machen");
        return;
    }

    listen = JSON.parse(letzterStand);

    letzterStand = null;

    speichern();
    anzeigen();

    toast("Rückgängig ✓");
}

function statistikAnzeigen() {

    const artikel = listen[aktuelleListe];

    const gesamt = artikel.length;

    const gekauft =
        artikel.filter(a => a.gekauft).length;

    document.getElementById("anzahl").textContent = gesamt;
    document.getElementById("gekauft").textContent = gekauft;

    const prozent =
        gesamt === 0 ? 0 : (gekauft / gesamt) * 100;

    document.getElementById("progressBar").style.width =
        prozent + "%";
}

function listenAnzeigen() {

    const container =
        document.getElementById("listButtons");

    container.innerHTML = "";

    Object.keys(listen).forEach(name => {

        const button =
            document.createElement("button");

        button.className =
            "list-button " +
            (name === aktuelleListe ? "active" : "");

        button.textContent = name;

        button.onclick = () => {

            aktuelleListe = name;

            speichern();
            anzeigen();
        };

        container.appendChild(button);
    });

    document.getElementById("listenTitel").textContent =
        aktuelleListe;
}

function neueListe() {

    const name =
        prompt("Name der neuen Einkaufsliste:");

    if (!name || !name.trim()) return;

    const listenName = name.trim();

    if (listen[listenName]) {
        toast("Diese Liste gibt es bereits.");
        return;
    }

    listen[listenName] = [];

    aktuelleListe = listenName;

    speichern();
    anzeigen();

    toast("Neue Liste erstellt ✓");
}

function darkMode() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );
}

function backupExportieren() {

    const daten = JSON.stringify(listen, null, 2);

    const blob =
        new Blob([daten], {
            type: "application/json"
        });

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "einkaufslisten-backup.json";

    a.click();

    URL.revokeObjectURL(url);

    toast("Backup gespeichert ✓");
}

function backupImportieren() {

    document.getElementById("backupDatei").click();
}

function backupDateiLaden(event) {

    const datei = event.target.files[0];

    if (!datei) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const daten =
                JSON.parse(e.target.result);

            if (typeof daten !== "object") {
                throw new Error();
            }

            listen = daten;

            if (!listen[aktuelleListe]) {
                aktuelleListe =
                    Object.keys(listen)[0];
            }

            speichern();
            anzeigen();

            toast("Backup geladen ✓");

        } catch {

            toast("Backup ist ungültig.");
        }
    };

    reader.readAsText(datei);
}

function allesZuruecksetzen() {

    const bestaetigung =
        confirm(
            "Wirklich ALLE Einkaufslisten und Daten löschen?"
        );

    if (!bestaetigung) return;

    listen = {
        "Meine Einkaufsliste": []
    };

    aktuelleListe =
        "Meine Einkaufsliste";

    letzterStand = null;

    localStorage.clear();

    speichern();
    anzeigen();

    toast("Alle Daten gelöscht");
}

if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
}

anzeigen();

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")
            .then(() => {
                console.log("Service Worker aktiv");
            })
            .catch(error => {
                console.log(
                    "Service Worker Fehler:",
                    error
                );
            });

    });
}

</script>

</body>
</html>
